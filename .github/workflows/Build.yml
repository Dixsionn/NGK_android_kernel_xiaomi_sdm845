name: Build Kernel

on:
  workflow_dispatch:
  

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    # WAJIB: Izin Write agar bisa membuat Release
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison build-essential ccache curl flex binutils \
          git libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make \
          python3 python3-pip unzip zip zlib1g-dev gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu clang

    - name: Run Build Script
      run: |
        chmod +x compile-cs.sh
        ./compile-cs.sh

    # --- BAGIAN RELEASE GITHUB ---

    - name: Generate Release Tag
      id: tag
      run: |
        # Membuat tag unik berdasarkan Tanggal-Jam
        echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        echo "Tag generated: $(date +'%Y.%m.%d-%H%M')"

    - name: Create Release and Upload
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "Builduild - ${{ steps.tag.outputs.release_tag }}"
        files: zone_dipper/*.zip
        draft: false
        prerelease: false
        body: |

          **Date:** ${{ steps.tag.outputs.release_tag }}

           
          *Build completed successfully via GitHub Actions.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
